<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항</title>
  <link rel="stylesheet" href="notice.css">
  <script src="erp-auth.js"></script>
</head>

<body>

<header class="top">
  <button class="back" onclick="history.back()">←</button>
  <h1>공지사항</h1>
  <p>근무기강, 출퇴근, 위생교육 등 직원 공지</p>
</header>

<main class="wrap">

  <section class="card admin-card">
    <h2>공지 등록</h2>

    <label>공지 구분</label>
    <select id="category">
      <option value="공지사항">공지사항</option>
      <option value="긴급공지">긴급공지</option>
      <option value="위생점검안내">위생점검안내</option>
      <option value="인사공지">인사공지</option>
      <option value="매출공지">매출공지</option>
      <option value="인사복무">인사복무</option>
    </select>

    <label>공지 이미지</label>
    <select id="noticeType">
      <option value="main">일반공지</option>
      <option value="emergency">긴급공지</option>
      <option value="hygiene">위생점검안내</option>
      <option value="hr">인사공지</option>
      <option value="sales">매출공지</option>
      <option value="discipline">인사복무</option>
    </select>

    <label>대상</label>
    <select id="target">
      <option value="전체 직원">전체 직원</option>
      <option value="홀 직원">홀 직원</option>
      <option value="주방 직원">주방 직원</option>
      <option value="관리자">관리자</option>
    </select>

    <label>제목</label>
    <input id="title" type="text" placeholder="공지 제목 입력">

    <label>내용</label>
    <textarea id="content" placeholder="공지 내용을 입력하세요"></textarea>

    <!-- 첨부파일 -->
    <div class="form-group">
      <label for="fileUrl">📎 첨부파일 링크</label>

      <div style="display:flex;gap:10px;align-items:center;">
        <input
          id="fileUrl"
          type="url"
          placeholder="Google Drive 공유 링크를 붙여넣으세요"
          style="flex:1;"
        >

        <button
          type="button"
          onclick="window.open('https://drive.google.com/drive/my-drive','_blank')"
          style="width:auto;height:44px;padding:0 18px;background:#1f3d68;white-space:nowrap;font-size:14px;border-radius:10px;"
        >
          Google Drive 열기
        </button>
      </div>

      <div style="margin-top:10px;padding:14px 16px;background:#f6f8fb;border:1px solid #dbe3ee;border-radius:10px;font-size:13px;line-height:1.8;color:#475569;">
        <strong style="color:#1f3d68;">📎 첨부파일 등록 방법</strong><br>
        ① 위의 <b>Google Drive 열기</b>를 누릅니다.<br>
        ② Google Drive에 PDF·엑셀·한글·워드·이미지 등의 파일을 올립니다.<br>
        ③ 업로드한 파일을 마우스 오른쪽 버튼으로 누르고 <b>공유</b>를 선택합니다.<br>
        ④ 일반 액세스를 <b>링크가 있는 모든 사용자</b>로 변경합니다.<br>
        ⑤ <b>링크 복사</b>를 누른 뒤 위 첨부파일 링크 칸에 붙여넣습니다.
      </div>
    </div>

    <!-- 공지 종료일 -->
    <div class="form-group" style="margin-top:22px;">
      <label for="expireDate">📅 공지 종료일</label>

      <div style="position:relative;">
        <input
          id="expireDate"
          type="date"
          style="width:100%;padding-right:50px;cursor:pointer;"
          title="공지사항을 표시할 마지막 날짜를 선택하세요"
        >
      </div>

      <div style="margin-top:7px;font-size:12px;color:#64748b;">
        📅 날짜를 선택하면 해당 날짜까지 공지가 표시됩니다.
        종료일이 필요하지 않으면 비워두세요.
      </div>
    </div>

    <label>중요 공지</label>
    <select id="important">
      <option value="N">아니오</option>
      <option value="Y">예</option>
    </select>

    <label>작성자</label>
    <input id="writer" type="text" value="관리자">

    <button class="primary" onclick="saveNotice()">공지 등록</button>
  </section>

  <section class="card">
    <h2>공지 목록</h2>
    <div id="noticeList" class="notice-list">
      불러오는 중...
    </div>
  </section>

</main>

<script src="notice.js?v=20260922-1"></script>

</body>
</html>
