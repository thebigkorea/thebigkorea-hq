<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>공지사항</title>

  <!--
    주의:
    카카오톡/문자 미리보기 봇은 아래 OG 태그를 페이지의 JavaScript 실행 전에 읽습니다.
    따라서 GitHub Pages의 하나의 notice-view.html만 사용하는 구조에서는
    공지별 동적 OG 이미지를 HTML JavaScript만으로 변경할 수 없습니다.
    아래 이미지는 기본 미리보기 이미지입니다.
  -->
  <meta property="og:title" content="더큰코리아 공지사항">
  <meta property="og:description" content="공지사항 내용을 확인하세요.">
  <meta property="og:image" content="https://thebigkorea.github.io/thebigkorea-hq/images/notice-main.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="notice.css?v=20260922-3">

  <style>
    body{
      margin:0;
      background:#f3f5f8;
      font-family:"Pretendard","Noto Sans KR",sans-serif;
      color:#18212f;
    }

    #loadingScreen{
      position:fixed;
      inset:0;
      background:#f3f5f8;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:700;
      color:#0b1a3a;
      z-index:9999;
    }

    #loadingScreen::before{
      content:"";
      width:24px;
      height:24px;
      border:4px solid #d9dee7;
      border-top-color:#0b1a3a;
      border-radius:50%;
      margin-right:12px;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    .view-wrap{
      max-width:920px;
      margin:0 auto;
      padding:28px 18px 50px;
    }

    .view-brand{
      margin-bottom:14px;
      color:#64748b;
      font-size:11px;
      font-weight:800;
      letter-spacing:.14em;
    }

    .view-card{
      background:#fff;
      border:1px solid #e4e8ee;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 12px 34px rgba(15,23,42,.08);
    }

    .view-image{
      width:100%;
      max-height:430px;
      object-fit:cover;
      display:block;
      background:#eef2f6;
    }

    .view-body{
      padding:30px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:7px 12px;
      border-radius:999px;
      background:#172033;
      color:#fff;
      font-size:12px;
      font-weight:800;
      margin-bottom:15px;
    }

    .title{
      font-size:29px;
      line-height:1.3;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:13px;
    }

    .info{
      color:#7a8492;
      font-size:13px;
      padding-bottom:22px;
      border-bottom:1px solid #edf0f4;
      margin-bottom:24px;
    }

    .content{
      line-height:1.85;
      white-space:pre-wrap;
      font-size:16px;
      color:#344054;
      min-height:100px;
    }

    .file-btn{
      display:inline-block;
      margin-top:28px;
      padding:13px 18px;
      border-radius:12px;
      background:#203a5f;
      color:#fff;
      text-decoration:none;
      font-size:14px;
      font-weight:750;
    }

    @media(max-width:600px){
      .view-wrap{ padding:12px 10px 30px; }
      .view-body{ padding:20px 17px 24px; }
      .title{ font-size:23px; }
      .content{ font-size:15px; }
      .view-card{ border-radius:17px; }
    }
  </style>
</head>

<body>

  <div id="loadingScreen">공지사항을 불러오는 중입니다...</div>

  <div class="view-wrap">
    <div class="view-brand">THE BIG KOREA · NOTICE</div>

    <div class="view-card">
      <img id="noticeImage" class="view-image" src="" alt="공지 대표 이미지">

      <div class="view-body">
        <div id="noticeCategory" class="badge"></div>
        <div id="noticeTitle" class="title"></div>
        <div id="noticeInfo" class="info"></div>
        <div id="noticeContent" class="content"></div>

        <a id="fileButton"
           class="file-btn"
           target="_blank"
           rel="noopener"
           style="display:none;">
          📎 첨부파일 보기
        </a>
      </div>
    </div>
  </div>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycby8SCh-WsBXjBp1V-WsVKomUSWxlsWsnCUIMtNA8xTCNcnOqVGaQ-GCvyNY7XnzoLGgug/exec";

const IMAGE_BASE =
  "https://thebigkorea.github.io/thebigkorea-hq/images/";

const TYPE_IMAGES = {
  main: "notice-main.png",
  emergency: "notice-emergency.png",
  hygiene: "notice-hygiene.png",
  hr: "notice-hr.png",
  sales: "notice-sales.png",
  discipline: "notice-discipline.png"
};

document.addEventListener("DOMContentLoaded", loadNotice);

async function loadNotice(){
  const id = new URLSearchParams(location.search).get("id");

  if(!id){
    showError("공지번호가 없습니다.");
    return;
  }

  try{
    const res = await fetch(API_URL + "?action=getNotices");
    const data = await res.json();

    if(!data.success){
      showError("공지 조회에 실패했습니다.");
      return;
    }

    const notice = (data.notices || [])
      .find(n => String(n.noticeId) === String(id));

    if(!notice){
      showError("공지사항을 찾을 수 없습니다.");
      return;
    }

    renderNotice(notice);

  }catch(err){
    console.error(err);
    showError("서버 연결 오류가 발생했습니다.");
  }finally{
    document.getElementById("loadingScreen").style.display = "none";
  }
}

function renderNotice(n){
  const type = normalizeNoticeType(n.noticeType, n.category);
  const imageUrl = getNoticeImage(type);

  document.title = n.title || "더큰코리아 공지사항";

  // 핵심 수정:
  // 서버의 imageUrl이 비어 있거나 항상 기본이미지여도
  // 저장된 noticeType/category를 기준으로 정확한 이미지를 표시합니다.
  document.getElementById("noticeImage").src = imageUrl;

  document.getElementById("noticeCategory").innerText =
    categoryLabel(type, n.category);

  document.getElementById("noticeTitle").innerText =
    n.title || "";

  document.getElementById("noticeInfo").innerText =
    "작성자: " + (n.writer || "관리자") +
    "  ·  대상: " + (n.target || "전체 직원") +
    "  ·  작성일: " + formatDate(n.createdAt);

  document.getElementById("noticeContent").innerText =
    n.content || "";

  const btn = document.getElementById("fileButton");

  if(n.fileUrl){
    btn.href = n.fileUrl;
    btn.style.display = "inline-block";
  }else{
    btn.style.display = "none";
    btn.removeAttribute("href");
  }
}

function normalizeNoticeType(type, category){
  const valid = [
    "main",
    "emergency",
    "hygiene",
    "hr",
    "sales",
    "discipline"
  ];

  if(valid.includes(type)){
    return type;
  }

  const categoryMap = {
    "공지사항":"main",
    "일반공지":"main",
    "긴급공지":"emergency",
    "위생점검안내":"hygiene",
    "인사공지":"hr",
    "매출공지":"sales",
    "인사복무":"discipline"
  };

  return categoryMap[String(category || "").trim()] || "main";
}

function getNoticeImage(type){
  return IMAGE_BASE + (TYPE_IMAGES[type] || TYPE_IMAGES.main);
}

function categoryLabel(type, category){
  const labels = {
    main:"일반공지",
    emergency:"긴급공지",
    hygiene:"위생점검안내",
    hr:"인사공지",
    sales:"매출공지",
    discipline:"인사복무"
  };

  return labels[type] || category || "공지사항";
}

function formatDate(value){
  if(!value) return "";

  const d = new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleDateString("ko-KR", {
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  });
}

function showError(message){
  document.getElementById("loadingScreen").style.display = "none";

  const card = document.querySelector(".view-card");
  card.innerHTML =
    '<div style="padding:50px 20px;text-align:center;color:#64748b;">' +
    escapeHtml(message) +
    '</div>';
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
