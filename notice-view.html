<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더큰코리아 공지사항</title>

  <!-- 안정화 버전: 카카오 미리보기는 기본 이미지 유지 -->
  <meta property="og:title" content="더큰코리아 공지사항">
  <meta property="og:description" content="공지사항 내용을 확인하세요.">
  <meta property="og:image" content="https://thebigkorea.github.io/thebigkorea-hq/images/notice-main.png">
  <meta property="og:type" content="website">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#f3f6fa;
      color:#172033;
      font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;
    }
    #loadingScreen{
      position:fixed;inset:0;background:#f3f6fa;
      display:flex;align-items:center;justify-content:center;
      z-index:9999;font-weight:800;color:#203a5f;
    }
    #loadingScreen::before{
      content:"";width:23px;height:23px;margin-right:10px;
      border:4px solid #dce3eb;border-top-color:#203a5f;
      border-radius:50%;animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .wrap{max-width:900px;margin:0 auto;padding:25px 15px 50px}
    .brand{font-size:11px;letter-spacing:.15em;font-weight:850;color:#738096;margin-bottom:12px}
    .card{
      background:#fff;border:1px solid #e3e8ef;border-radius:20px;
      overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.07)
    }
    .image{
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  object-position:center top;
  display:block;
  background:#edf2f7;
}
    .body{padding:27px}
    .badge{
      display:inline-block;padding:6px 11px;border-radius:999px;
      background:#203a5f;color:#fff;font-size:12px;font-weight:800
    }
    .title{font-size:28px;font-weight:850;line-height:1.3;margin:14px 0 10px}
    .info{font-size:12px;color:#8590a0;border-bottom:1px solid #edf0f4;padding-bottom:19px}
    .content{font-size:16px;line-height:1.85;white-space:pre-wrap;color:#39475a;padding-top:21px;min-height:110px}
    .file-btn{
      display:inline-block;margin-top:25px;padding:12px 17px;border-radius:11px;
      background:#203a5f;color:#fff;text-decoration:none;font-size:13px;font-weight:800
    }
    @media(max-width:600px){
      .wrap{padding:10px}
      .body{padding:19px 16px 23px}
      .title{font-size:22px}
      .content{font-size:15px}
    }
  </style>
</head>
<body>

<div id="loadingScreen">공지사항을 불러오는 중입니다...</div>

<main class="wrap">
  <div class="brand">THE BIG KOREA · NOTICE</div>

  <article class="card">
    <img id="noticeImage" class="image" src="" alt="공지 이미지">

    <div class="body">
      <div id="noticeCategory" class="badge"></div>
      <div id="noticeTitle" class="title"></div>
      <div id="noticeInfo" class="info"></div>
      <div id="noticeContent" class="content"></div>

      <a id="fileButton"
         class="file-btn"
         target="_blank"
         rel="noopener"
         style="display:none;">
        📎 첨부파일 보기
      </a>
    </div>
  </article>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8SCh-WsBXjBp1V-WsVKomUSWxlsWsnCUIMtNA8xTCNcnOqVGaQ-GCvyNY7XnzoLGgug/exec";
const IMAGE_BASE = "https://thebigkorea.github.io/thebigkorea-hq/images/";

const IMAGE_FILES = {
  main:"notice-main.png",
  emergency:"notice-emergency.png",
  hygiene:"notice-hygiene.png",
  hr:"notice-hr.png",
  sales:"notice-sales.png",
  discipline:"notice-discipline.png"
};

document.addEventListener("DOMContentLoaded", loadNotice);

async function loadNotice(){
  const id = new URLSearchParams(location.search).get("id");

  if(!id){
    showError("공지번호가 없습니다.");
    return;
  }

  try{
    const res = await fetch(
      API_URL + "?action=getNotices&_=" + Date.now()
    );

    const text = await res.text();
    if(!text) throw new Error("서버 응답이 없습니다.");

    const data = JSON.parse(text);

    if(!data.success){
      throw new Error(data.message || "공지 조회 실패");
    }

    const notice = (data.notices || [])
      .find(n => String(n.noticeId) === String(id));

    if(!notice){
      showError("공지사항을 찾을 수 없습니다.");
      return;
    }

    renderNotice(notice);

  }catch(err){
    console.error(err);
    showError("공지사항을 불러오지 못했습니다.");
  }finally{
    document.getElementById("loadingScreen").style.display = "none";
  }
}

function renderNotice(n){
  const type = normalizeType(n.noticeType, n.category);

  document.title = n.title || "더큰코리아 공지사항";
  document.getElementById("noticeImage").src =
    IMAGE_BASE + (IMAGE_FILES[type] || IMAGE_FILES.main);

  document.getElementById("noticeCategory").textContent =
    n.category || "공지사항";

  document.getElementById("noticeTitle").textContent =
    n.title || "";

  document.getElementById("noticeInfo").textContent =
    "작성자: " + (n.writer || "관리자") +
    "  ·  대상: " + (n.target || "전체 직원") +
    "  ·  작성일: " + formatDate(n.createdAt);

  document.getElementById("noticeContent").textContent =
    n.content || "";

  const btn = document.getElementById("fileButton");

  if(n.fileUrl){
    btn.href = n.fileUrl;
    btn.style.display = "inline-block";
  }else{
    btn.style.display = "none";
  }
}

function normalizeType(type, category){
  if(IMAGE_FILES[type]) return type;

  const map = {
    "공지사항":"main",
    "일반공지":"main",
    "긴급공지":"emergency",
    "위생점검안내":"hygiene",
    "인사공지":"hr",
    "매출공지":"sales",
    "인사복무":"discipline"
  };

  return map[String(category || "").trim()] || "main";
}

function formatDate(value){
  if(!value) return "";

  const d = new Date(value);
  if(isNaN(d.getTime())) return value;

  return d.toLocaleDateString("ko-KR", {
    year:"numeric",month:"2-digit",day:"2-digit"
  });
}

function showError(message){
  document.getElementById("loadingScreen").style.display = "none";
  document.querySelector(".card").innerHTML =
    '<div style="padding:50px 20px;text-align:center;color:#718096">' +
    message +
    '</div>';
}
</script>
</body>
</html>
