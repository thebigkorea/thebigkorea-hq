<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>출장 통합관리</title>
  <link rel="stylesheet" href="trip-management.css">
</head>
<body>
<header class="top">
  <div>
    <h1>출장 통합관리</h1>
    <p>THE BIG KOREA · BUSINESS TRIP MANAGEMENT</p>
  </div>
  <button class="primary" type="button" onclick="location.href='trip.html'">+ 출장 신청</button>
</header>

<main class="wrap">
  <nav class="tabs">
    <button class="tab active" data-filter="ALL">전체 출장</button>
    <button class="tab" data-filter="승인대기">승인대기 <b id="tabPending">0</b></button>
    <button class="tab" data-filter="승인">승인완료</button>
    <button class="tab" data-filter="SETTLE">정산대기 <b id="tabSettle">0</b></button>
    <button class="tab" data-filter="정산완료">정산완료</button>
  </nav>

  <section class="cards">
    <article><span>전체 출장</span><strong id="totalCount">0</strong><small>건</small></article>
    <article class="warn"><span>승인대기</span><strong id="pendingCount">0</strong><small>건</small></article>
    <article><span>승인완료</span><strong id="approvedCount">0</strong><small>건</small></article>
    <article class="accent"><span>정산대기</span><strong id="settleCount">0</strong><small>건</small></article>
    <article class="done"><span>정산완료</span><strong id="settledCount">0</strong><small>건</small></article>
  </section>

  <section class="work">
    <div class="section-title">
      <div>
        <h2>처리할 업무</h2>
        <p>승인 또는 정산이 필요한 출장만 모아서 보여줍니다.</p>
      </div>
    </div>
    <div id="todoList" class="todo-list"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>출장 전체내역</h2>
        <p>출장자·기간·부서·상태를 한 화면에서 조회합니다.</p>
      </div>
      <div class="actions">
        <button class="soft" onclick="location.href='trip-admin.html'">승인 화면</button>
        <button class="soft" onclick="location.href='trip-expense.html'">정산 화면</button>
      </div>
    </div>

    <div class="filters">
      <input id="searchInput" type="search" placeholder="출장자, 동행자, 방문처, 부서 검색">
      <select id="statusFilter">
        <option value="">모든 상태</option>
        <option value="승인대기">승인대기</option>
        <option value="승인">승인완료</option>
        <option value="미정산">정산대기</option>
        <option value="정산완료">정산완료</option>
      </select>
      <button class="soft" type="button" onclick="loadTrips()">새로고침</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>출장기간</th><th>출장자</th><th>동행자</th><th>부서</th>
            <th>방문처</th><th>이동수단</th><th>승인상태</th><th>정산상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="tripTable">
          <tr><td colspan="9" class="empty">출장내역을 불러오는 중입니다.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div id="settleModal" class="modal" hidden>
  <div class="backdrop" onclick="closeSettle()"></div>
  <div class="modal-card">
    <div class="modal-head">
      <div><small>TRIP EXPENSE</small><h3>출장 정산</h3></div>
      <button onclick="closeSettle()">×</button>
    </div>
    <div id="settleInfo" class="info"></div>
    <label>주유비<div class="unit"><input id="fuel" type="number" min="0" value="0"><span>원</span></div></label>
    <label>실제 운행거리<div class="unit"><input id="distance" type="number" min="0" value="0"><span>km</span></div></label>
    <div class="modal-actions">
      <button class="soft" onclick="closeSettle()">취소</button>
      <button id="settleSave" class="primary" onclick="saveSettlement()">정산 완료</button>
    </div>
  </div>
</div>

<script src="trip-management.js"></script>
</body>
</html>
