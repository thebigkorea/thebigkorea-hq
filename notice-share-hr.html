<style>
body{font-family:"Pretendard",Arial,sans-serif;background:#f4f6f9;margin:0;color:#172033}
.box{max-width:520px;margin:80px auto;background:#fff;border-radius:18px;padding:32px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:24px;margin:0 0 12px}
p{color:#64748b;line-height:1.7}
a{display:inline-block;margin-top:12px;padding:13px 20px;border-radius:10px;background:#172a46;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>더큰코리아 인사공지</h1>
  <p>승진·발령·인사 관련 공지 내용을 확인하세요.</p>
  <a id="openNotice" href="#">공지 확인하기</a>
</div>

<script>
(function(){
  const id = new URLSearchParams(location.search).get("id") || "";
  const target = "https://thebigkorea.github.io/thebigkorea-hq/notice-view.html?id=" + encodeURIComponent(id);
  document.getElementById("openNotice").href = target;

  // 실제 사용자가 열었을 때만 실제 공지 화면으로 이동
  // OG 크롤러가 HTML을 먼저 읽을 시간을 확보하기 위해 즉시 meta refresh는 사용하지 않음.
  if (id) {
    setTimeout(function(){
      location.replace(target);
    }, 800);
  }
})();
</script>
</body>
</html>
